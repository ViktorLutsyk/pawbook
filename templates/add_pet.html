{% extends "base.html" %}
{% block title %}Add a Pet — PawBook{% endblock %}
{% block content %}
<a class="back" href="{{ url_for('index') }}">← Back to Directory</a>
<div class="page-header">
  <h1>Add a New Pet</h1>
  <p>Fill in the details below and upload a photo.</p>
</div>
<div class="form-wrap">
  <form method="post" enctype="multipart/form-data">
    <p class="section-title">Pet Details</p>
    <div class="form-row">
      <div class="form-group">
        <label for="name">Pet Name *</label>
        <input type="text" id="name" name="name" required placeholder="e.g. Biscuit">
      </div>
      <div class="form-group">
        <label for="species">Species *</label>
        <select id="species" name="species" required>
          <option value="" disabled selected>Choose…</option>
          <option value="dog">🐕 Dog</option>
          <option value="cat">🐈 Cat</option>
          <option value="other">🐾 Other</option>
        </select>
      </div>
      <div class="form-group">
        <label for="breed">Breed</label>
        <input type="text" id="breed" name="breed" placeholder="e.g. Golden Retriever">
      </div>
      <div class="form-group">
        <label for="age">Age (years)</label>
        <input type="number" id="age" name="age" step="0.5" min="0" max="30" placeholder="e.g. 3">
      </div>
      <div class="form-group span2">
        <label for="bio">Bio</label>
        <textarea id="bio" name="bio" placeholder="What makes this pet special?"></textarea>
      </div>
      <div class="form-group span2">
        <label>Photo</label>
        <label class="file-pill" for="photo">📎 Choose photo…</label>
        <input type="file" id="photo" name="photo" accept="image/*,video/*,.pdf">
        <span id="fn" class="file-hint">No file chosen</span>
      </div>
    </div>

    <p class="section-title" style="margin-top:1rem">Owner Details</p>
    <div class="form-row">
      <div class="form-group">
        <label for="owner_name">Owner Name</label>
        <input type="text" id="owner_name" name="owner_name" placeholder="Your name">
      </div>
      <div class="form-group">
        <label for="owner_email">Owner Email</label>
        <input type="email" id="owner_email" name="owner_email" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label for="owner_phone">Phone</label>
        <input type="tel" id="owner_phone" name="owner_phone" placeholder="+1 234 567 890">
      </div>
    </div>

    <div class="btn-row">
      <button type="submit" class="btn btn-primary">💾 Save Pet Profile</button>
      <a href="{{ url_for('index') }}" class="btn btn-ghost">Cancel</a>
    </div>
  </form>
</div>
<script>document.getElementById('photo').onchange=function(){document.getElementById('fn').textContent=this.files[0]?.name||'No file chosen';}</script>
{% endblock %}
